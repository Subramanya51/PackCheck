spring:

  application:
    name: packcheck

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

mqtt:
  broker: ${MQTT_BROKER}
  port: ${MQTT_PORT:8883}
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  client-id: ${MQTT_CLIENT_ID:packcheck-backend}

  topics:
    status: packcheck/v1/cart/+/status
    task: packcheck/v1/cart/+/task
    floor: packcheck/v1/cart/+/floor
    mode: packcheck/v1/cart/+/mode

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
app:
  frontend:
    url: http://localhost:3000
logging:
  level:
    org.springframework.security: INFO